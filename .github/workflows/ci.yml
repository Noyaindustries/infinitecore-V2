name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - main2
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Security audit (npm + git env)
        run: npm run test:security:audit

      - name: Unit, integration & security tests
        run: npm test

  e2e-security:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E security (API + auth bypass)
        run: npm run test:e2e -- tests/e2e/api-security.spec.ts tests/e2e/auth-bypass-security.spec.ts
